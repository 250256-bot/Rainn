        }

        .search input {

            padding: 3px 5px;
            font-family: inherit;
            font-size: 13px;
            border: 1px solid #777;

        .search button {
            padding: 3px 6px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
        }

        /* ---------- Рецепты ---------- */
        main {
            max-width: 530px;
            margin: 0 auto;
            padding: 30px 10px 40px;
        }

        .recipe {
            background: #fff;
            border: 1px solid #ddd;
            text-align: center;
            padding: 0 0 18px;
            margin-bottom: 30px;
        }

        .recipe img,
        .recipe .photo {
            display: block;
            width: 331px;
            max-width: 100%;
            height: 220px;
            margin: 0 auto;
            object-fit: cover;
            background: linear-gradient(135deg, #8a6a4a, #3c2a1c);
        }

        .recipe h2 {
            font-size: 20px;
            margin: 22px 0 18px;
        }

        .recipe p {
            font-size: 14px;
            margin: 0 0 18px;
        }

        .recipe a {
            color: #ff5733;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
        }

        .recipe a:hover {
            text-decoration: underline;
        }

        #noResults {
            display: none;
            text-align: center;
            font-size: 15px;
            margin: 20px 0;
        }

        /* ---------- Подвал с подпиской и картой ---------- */
        footer {
            background-color: #ff5733;
            color: #fff;
            text-align: center;
            padding: 14px 10px 0;
        }

        footer h3 {
            margin: 0 0 12px;
            font-size: 13px;
        }

        .subscribe {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .subscribe input {
            width: 146px;
            padding: 8px 8px;
            font-family: inherit;
            font-size: 11px;
            border: none;
            border-radius: 4px;
        }

        .subscribe button {
            padding: 8px 14px;
            font-family: inherit;
            font-size: 11px;
            color: #fff;
            background-color: #ff8a5c;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .subscribe button:hover {
            background-color: #ff9a72;
        }

        #subscribeMessage {
            min-height: 18px;
            margin: 8px 0 0;
            font-size: 12px;
        }

        .map {
            margin: 20px auto 0;
            width: 400px;
            max-width: 100%;
        }

        .map iframe {
            display: block;
            width: 100%;
            height: 300px;
            border: 0;
        }

        /* ---------- Кнопка «Наверх» ---------- */
        #scrollToTopButton {
            font-family: 'Comic Sans MS', cursive;
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 50%;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        /* ---------- Дождь ---------- */
        canvas#rainfall {
            position: fixed;       /* Фиксируем на экране, не двигается при прокрутке */
            top: 0;
            left: 0;
            z-index: 1000;         /* Поверх всего сайта */
            pointer-events: none;  /* Клики проходят сквозь дождь на сайт */
        }
    </style>
</head>

    <footer>
        <h3>Подписка на рассылку:</h3>
        <div class="subscribe">
            <input type="email" id="emailInput" placeholder="Введите ваш email">
            <button onclick="subscribe()">Подписаться</button>
        </div>
        <p id="subscribeMessage"></p>

        <div class="map">
            <iframe
                src="https://www.google.com/maps?q=Колледж+Туран+Алматы+улица+Наурызбай+батыра+176&output=embed"
                allowfullscreen
                loading="lazy"
                title="Карта: Колледж Туран">
            </iframe>
        </div>
    </footer>

    <button id="scrollToTopButton" onclick="scrollToTop()">Наверх</button>

    <script>
        // ---------- Поиск по рецептам ----------
        function searchRecipes() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase(); // Текст запроса
            const recipes = document.querySelectorAll('.recipe'); // Все карточки рецептов
            let found = 0; // Счётчик найденных
            recipes.forEach(function (recipe) {
                const title = recipe.querySelector('h2').textContent.toLowerCase(); // Название рецепта
                const text = recipe.querySelector('p').textContent.toLowerCase(); // Описание рецепта
                const match = title.includes(query) || text.includes(query); // Совпадение в названии или описании
                recipe.style.display = match ? '' : 'none'; // Показываем или прячем карточку
                if (match) found++;
            });
            document.getElementById('noResults').style.display = found === 0 ? 'block' : 'none'; // Сообщение, если пусто
        }

        document.getElementById('searchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') searchRecipes(); // Поиск по нажатию Enter
        });

        // ---------- Подписка на рассылку ----------
        function subscribe() {
            const email = document.getElementById('emailInput').value.trim(); // Введённый email
            const message = document.getElementById('subscribeMessage'); // Место для сообщения
            const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); // Простая проверка формата email
            if (valid) {
                message.textContent = 'Спасибо! Вы подписались на рассылку.';
                document.getElementById('emailInput').value = '';
            } else {
                message.textContent = 'Введите корректный email, например name@mail.com';
            }
        }

        // ---------- Кнопка «Наверх» ----------
        const scrollButton = document.getElementById('scrollToTopButton');

        window.addEventListener('scroll', function () {
            const scrolled = document.body.scrollTop || document.documentElement.scrollTop; // Сколько прокручено
            scrollButton.style.display = scrolled > 200 ? 'block' : 'none'; // Показываем кнопку после 200px
        });

        function scrollToTop() { // Прокрутка страницы вверх
            document.body.scrollTop = 0; // Для старых браузеров
            document.documentElement.scrollTop = 0; // Для остальных
        }

        // ---------- Дождь ----------
        const canvas = document.getElementById('rainfall'); // Элемент canvas
        const ctx = canvas.getContext('2d'); // Контекст 2D
        let width = window.innerWidth; // Ширина окна
        let height = window.innerHeight; // Высота окна
        canvas.width = width;
        canvas.height = height;
        const raindrops = []; // Массив капель
        const numberOfDrops = 300; // Количество капель
        const wind = 1.5; // Наклон дождя (0 — отвесный)

        function generateRaindrops() { // Создание капель
            for (let i = 0; i < numberOfDrops; i++) {
                raindrops.push({
                    x: Math.random() * (width + 100) - 50, // Случайная позиция по горизонтали
                    y: Math.random() * height, // Случайная позиция по вертикали
                    length: Math.random() * 15 + 10, // Длина капли от 10 до 25
                    speed: Math.random() * 8 + 12, // Скорость от 12 до 20
                    thickness: Math.random() * 0.8 + 0.7, // Толщина от 0.7 до 1.5
                    opacity: Math.random() * 0.3 + 0.35 // Прозрачность от 0.35 до 0.65
                });
            }
        }

        function drawRaindrops() { // Отрисовка капель
            ctx.clearRect(0, 0, width, height); // Очищаем canvas, сайт под дождём виден
            ctx.lineCap = 'round';
            for (let i = 0; i < raindrops.length; i++) {
                const drop = raindrops[i];
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(120, 165, 220, ' + drop.opacity + ')'; // Голубоватый, виден на белом и на оранжевом
                ctx.lineWidth = drop.thickness;
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x + wind * (drop.length / drop.speed) * 3, drop.y + drop.length);
                ctx.stroke();
            }
            moveRaindrops();
        }

        function moveRaindrops() { // Перемещение капель
            for (let i = 0; i < raindrops.length; i++) {
                const drop = raindrops[i];
                drop.y += drop.speed; // Падение вниз
                drop.x += wind; // Смещение от ветра
                if (drop.y > height) { // Упала за нижний край
                    drop.y = -drop.length; // Возвращаем наверх
                    drop.x = Math.random() * (width + 100) - 50;
                }
                if (drop.x > width + 50) { // Ушла за правый край
                    drop.x = -50;
                }
            }
        }

        function animateRaindrops() { // Анимация
            drawRaindrops();
            requestAnimationFrame(animateRaindrops);
        }

        generateRaindrops();
        animateRaindrops();

        window.addEventListener('resize', function () { // При изменении размера окна
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            raindrops.length = 0;
            generateRaindrops();
        });
    </script>
</body>
